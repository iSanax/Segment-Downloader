name: Build release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: windows
            bundle: --onefile
            data-separator: ";"

          - name: Linux
            os: ubuntu-latest
            artifact: linux
            bundle: --onefile
            data-separator: ":"

          - name: macOS
            os: macos-latest
            artifact: macos
            bundle: --onedir
            data-separator: ":"

    steps:
      - name: Download repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Tkinter on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pyinstaller

      - name: Compile translations
        run: python tools/compile_translations.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build application
        run: python -m PyInstaller ${{ matrix.bundle }} --windowed --noconfirm --clean --name Segment-Downloader --distpath .output --workpath build --specpath build --paths . --add-data "${{ github.workspace }}/lang/bin${{ matrix.data-separator }}lang/bin" app/main.py

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item ".output\Segment-Downloader.exe" "release\Segment-Downloader-windows.exe" -Force

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -czf release/Segment-Downloader-linux.tar.gz -C .output Segment-Downloader

      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            .output/Segment-Downloader.app \
            release/Segment-Downloader-macos.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  upload:
    name: Add files to GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Upload files to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            release/* \
            --clobber
